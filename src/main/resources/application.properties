spring.application.name=todo-app-back

# H2, file-based so data survives restarts (see docs on choice of H2 vs Postgres later)
spring.datasource.url=jdbc:h2:file:./data/todo-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Dev-only inspector at /h2-console. Disable before deploying anywhere reachable.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
