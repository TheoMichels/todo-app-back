spring.application.name=todo-app-back

# In-memory, isolated from the dev file-based DB so test runs never accumulate data.
spring.datasource.url=jdbc:h2:mem:todo-app-back-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
